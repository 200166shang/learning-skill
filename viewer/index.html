<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning Map</title>
  </head>
  <body>
    <main id="app">
      <header>
        <div>
          <p class="eyebrow">LEARNING MAP</p>
          <h1 id="goal-title">Learning Companion</h1>
          <p id="goal-objective" class="subtitle">Connecting to the Learning workspace…</p>
        </div>
        <button id="pin" type="button" aria-pressed="false" title="Keep this window above other apps">Pin</button>
      </header>
      <section id="notice" class="notice" hidden></section>
      <section id="goal-list" class="goal-list" hidden></section>
      <section id="graph" aria-label="Learning question tree"></section>
      <section id="details" class="details" aria-live="polite">
        <p class="eyebrow">CURRENT</p>
        <h2>Select a node</h2>
        <p class="muted">Question context will appear here.</p>
      </section>
    </main>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
