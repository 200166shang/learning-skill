<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learning V5 Review Queue 原型</title>
  <style>
    :root { color-scheme:light; --ink:#202033; --muted:#6b6b7b; --paper:#f4f1ea; --card:#fff; --line:#ddd7ca; --accent:#5b4b9a; --good:#2f6c52; --bad:#a04437; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif; }
    main { max-width:1120px; margin:auto; padding:42px 24px 80px; }
    h1 { margin:0 0 8px; font-size:30px; letter-spacing:-.02em; }
    h2 { margin:0 0 14px; font-size:18px; }
    p { margin:6px 0; }
    .muted { color:var(--muted); }
    .question { margin:20px 0 26px; padding:15px 17px; border-left:4px solid var(--accent); background:#ece8f7; }
    .grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(380px,.95fr); gap:18px; align-items:start; }
    .card { padding:18px; border:1px solid var(--line); border-radius:12px; background:var(--card); box-shadow:0 4px 18px #24202f0a; }
    .section { margin-top:18px; }
    .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
    .metric { padding:10px 12px; border-radius:8px; background:#faf9f6; }
    .metric strong { display:block; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
    .prompt { padding:16px; border:1px solid #cfc7e8; border-radius:10px; background:#f7f5fc; }
    .prompt strong { display:block; margin-bottom:5px; color:var(--accent); }
    .buttons, .tabs { display:flex; flex-wrap:wrap; gap:8px; }
    button { padding:8px 11px; border:1px solid var(--line); border-radius:8px; color:var(--ink); background:#fff; cursor:pointer; text-align:left; }
    button:hover { border-color:var(--accent); }
    button.primary, .tabs button.active { color:#fff; border-color:var(--accent); background:var(--accent); }
    button:disabled { opacity:.42; cursor:not-allowed; }
    .queue { display:grid; gap:9px; margin-top:12px; }
    .target { padding:11px 12px; border:1px solid var(--line); border-radius:8px; }
    .target.due { border-color:#d4a39b; background:#fff7f5; }
    .target.current { border-color:var(--accent); background:#f7f5fc; }
    .target small { display:block; color:var(--muted); }
    .message { margin-top:12px; color:var(--good); font-weight:600; }
    .error { color:var(--bad); }
    .steps { display:grid; gap:8px; margin-top:12px; }
    .steps button.done { color:var(--muted); text-decoration:line-through; }
    pre { margin:0; max-height:760px; overflow:auto; padding:16px; border-radius:9px; color:#eeeafa; background:#211e2c; white-space:pre-wrap; font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; }
    @media(max-width:850px){ .grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr} }
  </style>
</head>
<body>
<main>
  <h1>Learning V5：Review Queue 原型</h1>
  <p class="muted">一次性逻辑原型，不是产品界面。它展示一个人能否直接从 Markdown 看懂：为什么某项到期、一次回答如何改变间隔、错误知识为何停止复习。</p>
  <div class="question"><strong>要回答的问题：</strong>一个固定间隔阶梯和四种人类可读结果，能否形成足够简单、有用、可纠错的个人间隔复习闭环？</div>

  <div class="grid">
    <div>
      <section class="card">
        <h2>今天与到期状态</h2>
        <div id="summary" class="summary"></div>
        <div id="current"></div>
        <div id="message" class="message"></div>
        <div id="queue" class="queue"></div>
      </section>

      <section class="card section">
        <h2>自由操作</h2>
        <div id="freeplay" class="buttons"></div>
      </section>

      <section class="card section">
        <h2>引导场景</h2>
        <div id="tabs" class="tabs"></div>
        <p id="scenario-copy" class="muted"></p>
        <div id="steps" class="steps"></div>
      </section>
    </div>

    <section class="card">
      <h2>当前 REVIEW.md</h2>
      <pre id="markdown"></pre>
    </section>
  </div>
</main>

<script>
  // Pure prototype module: scheduling and queue transitions contain no DOM logic.
  const ReviewQueue = (() => {
    const ladder = [1, 3, 7, 14, 30, 90];
    const labels = ladder.map(days => `${days}d`);
    const addDays = (iso, days) => {
      const [year, month, day] = iso.split("-").map(Number);
      return new Date(Date.UTC(year, month - 1, day + days)).toISOString().slice(0, 10);
    };
    const initial = () => ({
      today: "2026-09-15",
      current: null,
      message: "选择最早到期的记忆目标开始。",
      error: false,
      targets: [
        {
          prompt: "为什么测量电流超过目标时，控制器会降低 PWM 占空比？",
          status: "active",
          source: "motor-current-limit.md#限流闭环",
          shape: "mechanism",
          expected: "测量值形成负向误差，限幅分支降低占空比请求，平均电压下降使电流回落。",
          stage: 0,
          nextReview: "2026-09-15",
          lastResult: "尚未复习"
        },
        {
          prompt: "借用与所有权转移的判断边界是什么？",
          status: "active",
          source: "rust-ownership.md#借用与转移",
          shape: "distinction",
          expected: "转移改变所有者并使原绑定失效；借用只暂时授予访问权且受生命周期与可变性约束。",
          stage: 2,
          nextReview: "2026-09-14",
          lastResult: "2026-09-07，顺利想起"
        },
        {
          prompt: "看到 API 限流响应时，第一步应检查什么？",
          status: "active",
          source: "api-rate-limit.md#诊断步骤",
          shape: "application",
          expected: "先区分服务端配额、客户端并发和退避策略，再根据响应头定位限制窗口。",
          stage: 1,
          nextReview: "2026-09-18",
          lastResult: "2026-09-15，费力想起"
        }
      ]
    });

    const dueIndexes = state => state.targets
      .map((target, index) => ({ target, index }))
      .filter(({ target }) => target.status === "active" && target.nextReview <= state.today)
      .sort((a, b) => a.target.nextReview.localeCompare(b.target.nextReview) || a.index - b.index)
      .map(({ index }) => index);

    const updateCurrent = (state, transform, message) => {
      if (state.current === null) return { ...state, message: "当前没有正在复习的目标。", error: true };
      const targets = state.targets.map((target, index) => index === state.current ? transform(target) : target);
      return { ...state, targets, current: null, message, error: false };
    };

    function reduce(state, action) {
      switch (action.type) {
        case "RESET": return initial();
        case "START_DUE": {
          const due = dueIndexes(state);
          if (!due.length) return { ...state, current: null, message: "今天没有到期目标。", error: false };
          return { ...state, current: due[0], message: "只显示提示；先回忆，再判断结果。", error: false };
        }
        case "FORGOT":
          return updateCurrent(state, target => ({
            ...target,
            stage: 0,
            nextReview: addDays(state.today, ladder[0]),
            lastResult: `${state.today}，未想起`
          }), "补回缺失连接；阶段重置为 1d，明天再看。");
        case "EFFORTFUL":
          return updateCurrent(state, target => ({
            ...target,
            nextReview: addDays(state.today, ladder[target.stage]),
            lastResult: `${state.today}，费力想起`
          }), "保持当前阶段，再经过同样间隔复习。");
        case "FLUENT":
          return updateCurrent(state, target => {
            const stage = Math.min(target.stage + 1, ladder.length - 1);
            return { ...target, stage, nextReview: addDays(state.today, ladder[stage]), lastResult: `${state.today}，顺利想起` };
          }, "前进一个阶段；90d 是透明阶梯的上限。");
        case "NEEDS_REVISION":
          return updateCurrent(state, target => ({ ...target, status: "needs-revision", nextReview: "—", lastResult: `${state.today}，需要修订` }), "该目标已退出到期队列，等待从来源线程修订。");
        case "RETIRE":
          return updateCurrent(state, target => ({ ...target, status: "retired", nextReview: "—", lastResult: `${state.today}，已停用` }), "目标已停用，但来源关系仍保留。");
        case "NO_DUE":
          return { ...state, current: null, targets: state.targets.map(target => target.status === "active" ? { ...target, nextReview: addDays(state.today, 3) } : target), message: "构造了一个今天没有到期目标的场景。", error: false };
        default: return { ...state, message: `未知操作：${action.type}`, error: true };
      }
    }

    function markdown(state) {
      const lines = ["# Review Queue", ""];
      for (const target of state.targets) {
        lines.push(`## ${target.prompt}`);
        lines.push(`- 状态：${target.status}`);
        lines.push(`- 来源线程：[打开解释](./${target.source})`);
        lines.push(`- 目标类型：${target.shape}`);
        lines.push(`- 期待连接：${target.expected}`);
        lines.push(`- 阶段：${labels[target.stage]}`);
        lines.push(`- 下次复习：${target.nextReview}`);
        lines.push(`- 上次结果：${target.lastResult}`, "");
      }
      return lines.join("\n");
    }

    return { initial, reduce, markdown, dueIndexes, labels };
  })();

  const actions = [
    ["开始最早到期项", "START_DUE"], ["未想起", "FORGOT"], ["费力想起", "EFFORTFUL"],
    ["顺利想起", "FLUENT"], ["发现内容需要修订", "NEEDS_REVISION"], ["停用当前目标", "RETIRE"],
    ["构造无到期场景", "NO_DUE"], ["重置", "RESET"]
  ];

  const scenarios = [
    { name:"顺利想起", copy:"最早到期的 7d 目标被选中；顺利回忆后进入 14d。", steps:[["开始最早到期项","START_DUE"],["标记顺利想起","FLUENT"],["查看下一个到期项","START_DUE"]] },
    { name:"费力想起", copy:"正确但需要明显提示时不升级，保持当前间隔。", steps:[["开始最早到期项","START_DUE"],["标记费力想起","EFFORTFUL"]] },
    { name:"没有想起", copy:"无法重建关键连接时先修补，然后重置到 1d。", steps:[["开始最早到期项","START_DUE"],["标记未想起","FORGOT"]] },
    { name:"知识需要纠正", copy:"问题或期待连接已经不可靠时，停止调度并回到来源线程。", steps:[["开始最早到期项","START_DUE"],["标记需要修订","NEEDS_REVISION"],["选择下一到期项","START_DUE"]] },
    { name:"今天没有到期", copy:"空队列不会制造练习，只报告没有到期项。", steps:[["把所有活动项移到未来","NO_DUE"],["尝试开始复习","START_DUE"]] }
  ];

  let state = ReviewQueue.initial();
  let currentScenario = 0;
  let completedSteps = 0;

  function perform(type) { state = ReviewQueue.reduce(state, { type }); }
  function dispatch(type) { perform(type); render(); }
  function startScenario(index) { state = ReviewQueue.initial(); currentScenario = index; completedSteps = 0; render(); }

  function render() {
    const due = ReviewQueue.dueIndexes(state);
    const active = state.targets.filter(target => target.status === "active").length;
    const revision = state.targets.filter(target => target.status === "needs-revision").length;
    document.querySelector("#summary").innerHTML = `
      <div class="metric"><strong>今天</strong>${state.today}</div>
      <div class="metric"><strong>到期 / 活动</strong>${due.length} / ${active}</div>
      <div class="metric"><strong>需要修订</strong>${revision}</div>`;
    const current = state.current === null ? null : state.targets[state.current];
    document.querySelector("#current").innerHTML = current
      ? `<div class="prompt"><strong>当前只显示提示</strong>${current.prompt}<p class="muted">先自己回答，再点击结果；期待连接暂时不展示。</p></div>`
      : `<div class="prompt"><strong>当前目标</strong>尚未选择</div>`;
    document.querySelector("#message").className = `message${state.error ? " error" : ""}`;
    document.querySelector("#message").textContent = state.message;
    document.querySelector("#queue").innerHTML = state.targets.map((target, index) => {
      const classes = ["target", target.status === "active" && target.nextReview <= state.today ? "due" : "", state.current === index ? "current" : ""].join(" ");
      return `<div class="${classes}"><strong>${target.prompt}</strong><small>${target.status} · ${ReviewQueue.labels[target.stage]} · 下次 ${target.nextReview} · ${target.lastResult}</small></div>`;
    }).join("");
    document.querySelector("#markdown").textContent = ReviewQueue.markdown(state);

    document.querySelector("#tabs").innerHTML = scenarios.map((scenario, index) => `<button class="${index === currentScenario ? "active" : ""}" data-tab="${index}">${scenario.name}</button>`).join("");
    document.querySelectorAll("[data-tab]").forEach(button => button.onclick = () => startScenario(Number(button.dataset.tab)));
    const scenario = scenarios[currentScenario];
    document.querySelector("#scenario-copy").textContent = scenario.copy;
    document.querySelector("#steps").innerHTML = scenario.steps.map(([label], index) => `<button data-step="${index}" class="${index < completedSteps ? "done" : ""}" ${index !== completedSteps ? "disabled" : ""}>${index + 1}. ${label}</button>`).join("");
    document.querySelectorAll("[data-step]").forEach(button => button.onclick = () => { const [, type] = scenario.steps[completedSteps]; perform(type); completedSteps++; render(); });
  }

  document.querySelector("#freeplay").innerHTML = actions.map(([label, type], index) => `<button class="${index === 0 ? "primary" : ""}" data-action="${type}">${label}</button>`).join("");
  document.querySelectorAll("[data-action]").forEach(button => button.onclick = () => dispatch(button.dataset.action));
  render();
</script>
</body>
</html>
